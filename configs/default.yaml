# The harness: simulator, loop, safety, dashboard and scoring. These are the
# same for every driving stack, so two stacks run on this file are compared
# fairly. The stack itself is named below and owns everything about
# perception, planning, control and its sensor rig, with its own defaults
# next to its code.
#
# Every key is checked: a misspelled or outdated one stops the run at
# startup instead of silently falling back to a default.

# Python import path of a function that takes stack_config and returns the
# stack. Adding a stack is adding a module; nothing here lists them.
stack: offroad_autonomy.stacks.mono_yoloe:build
# Read only by the stack, on top of its own defaults; docs/stacks/<stack>/
# lists its keys.
stack_config: {}

beamng:
  # BEAMNG_HOME / BEAMNG_HOST / BEAMNG_PORT / BEAMNG_LAUNCH override these, so
  # a deployment can point at its simulator without editing this file.
  # The install folder is personal, so it comes from BEAMNG_HOME; empty means
  # the stack attaches to a simulator someone already started.
  home: ""
  # auto: localhost on Windows and mirrored WSL2, the Windows host under NAT
  # WSL2, and unset (BEAMNG_HOST required) on macOS and Linux, because
  # BeamNG.tech runs only on Windows. See utils/environment.py.
  host: auto
  port: 64256
  # auto launches only from Windows with a local host and a home folder;
  # false attaches to an already running simulator and never quits it.
  launch: auto
  # auto picks shared_memory, the fastest, only for a native Windows client
  # on the same machine; it cannot cross the network or the WSL2 VM boundary.
  camera_transport: auto
  map: automation_test_track
  vehicle: hopper
  spawn_index: 0
  maps:
    jungle_rock_island:
      spawns:
        - pos: [122.03, -74.66, 158.65]
          rot: [0, 0, 0.966, 0.259]
        - pos: [353.80, -151.3, 160.19]
          rot: [0, 0, -0.875, 0.484]
    johnson_valley:
      spawns:
        - pos: [-1152, 291.05, 119.84]
          rot: [0, 0, 0, 1]
    west_coast_usa:
      spawns:
        - pos: [565.13, 27.664, 148.06]
          rot: [0, 0, -0.934, 0.355]
    utah:
      spawns:
        - pos: [575, 118, 132]
          rot: [0, 0, 0, 1]
        - pos: [200, 200, 135]
          rot: [0, 0, 0.707, 0.707]
    small_island:
      spawns:
        - pos: [240, 215, 37]
          rot: [0, 0, 0, 1]
        - pos: [145, 240, 37]
          rot: [0, 0, 0.707, 0.707]
    east_coast_usa:
      spawns:
        - pos: [-700, 50, 35]
          rot: [0, 0, 0, 1]
    automation_test_track:
      spawns:
        - pos: [-384.82, 84.05, 114.82]
          rot: [0, 0, 0.6962, 0.7175]
        - pos: [-374.83, 84.82, 118.0]
          rot: [0, 0, 0, 1]
        - pos: [487.25, 178.73, 131.93]
          rot: [0, 0, 0, 1]
        - pos: [-294.03, 10.41, 118.52]
          rot: [0, 0, 0, 1]
        - pos: [-388.39, 91.28, 120.0]
          rot: [0, 0, 0, 1]

# The harness's own safe stop, the same for every stack. A stack can also
# ask for one for a condition only it can see, but it can never disable
# these.
safety:
  # Throttle above stuck_throttle_min while slower than stuck_speed_mps for
  # stuck_time_s: the wheels are pushing and the vehicle is not moving.
  stuck_speed_mps: 0.4
  stuck_throttle_min: 0.15
  stuck_time_s: 3.0

benchmark:
  # Reference routes for cross-track error, one per map and spawn, named
  # <map>_spawn<index>.json. Record one with --record-route on a clean
  # drive; a run without one reports its cross-track metrics as null.
  routes_dir: routes
  # Distance between recorded route points. On a 5 m radius bend a 0.5 m
  # chord strays 6 mm from the arc, far below any cross-track worth scoring.
  route_spacing_m: 0.5
  # A departure is the vehicle's true position this far off the route. A
  # 6 m trail (the S-bend simulation's) less the 1.9 m vehicle leaves
  # 2.05 m each side; a design choice, not measured per map.
  departure_cross_track_m: 2.0
  # Steering inside +/- this is "straight" when counting sign changes, so
  # dithering around zero is not scored as weaving.
  steer_sign_deadband: 0.05

visualization:
  dashboard:
    # BGR, not RGB. Graphite: a neutral charcoal chrome so the only saturated
    # colours on screen are the ones that carry meaning (health, path, mask).
    colors:
      BG: [17, 15, 14]
      PANEL_BG: [27, 24, 22]
      CARD_BG: [36, 32, 29]
      CARD_BORDER: [58, 52, 48]
      TEXT_PRIMARY: [255, 255, 255]
      TEXT_SECONDARY: [180, 172, 166] # still reads on CARD_BG at small sizes
      MUTED_LINE: [66, 59, 54]
      MASK_FILL: [191, 179, 79] # teal, so it never reads as the green of a healthy value
      MASK_EDGE: [240, 235, 189]
      PATH_GLOW: [77, 154, 255]
      PATH_CORE: [26, 122, 255]
      PATH_HIGHLIGHT: [234, 244, 255]
      GOOD: [138, 214, 91]
      WARN: [59, 185, 245]
      BAD: [91, 91, 255]
      EGO_EXCLUDED: [255, 91, 212] # magenta: distinct from the mask teal and the fault red
    # The autonomy loop's target rate. Below it the readout turns amber,
    # then red once it falls under fps_warn_fraction of the target.
    target_fps: 7.0
    fps_warn_fraction: 0.8 # amber from 80% of the target up to the target; a design choice, not measured
    # One frame period at target_fps (1000 / 7). Latency past this means the
    # loop cannot hold its target.
    latency_budget_ms: 143.0
    # Bar full scales as multiples of the target or budget, so the target tick
    # sits inside the bar instead of at its end.
    fps_bar_scale: 2.0
    latency_bar_scale: 1.4

ui:
  # Suppress the window for containers and machines without a screen.
  # Sensor capture and the stack still run. --headless does the same.
  headless: false
  # With display_async the dashboard is on its own thread and skipping buys
  # nothing; this only matters when display_async is false.
  render_every_n: 1
  # Keeps rendering and GUI time out of the autonomy loop, so "Autonomy FPS"
  # measures the vehicle rather than the window. auto turns it off on macOS,
  # which drives OpenCV windows only from the main thread, and on WSL2, where
  # WSLg hangs on the first frame drawn from another thread.
  display_async: auto
  # The autonomy loop is not synchronised to this; lowering it frees GPU/CPU
  # for perception and nothing else.
  display_rate_hz: 20.0
  # Page shown at startup: 0 is the main view, 1-9 the stack's own layers
  # in the order it emits them.
  # The same digit keys switch at runtime; T toggles the timing overlay.
  debug_page: 0
  timing_overlay: false
  log_interval_s: 5.0

recording:
  # --record-video writes the dashboard, as drawn, to an H.264 mp4 through the
  # ffmpeg binary, because OpenCV's bundled encoder cannot produce H.264 and
  # its mp4v output does not play in browsers or the VS Code media preview.
  # Matches ui.display_rate_hz: frames arrive at that rate, so a higher value
  # only repeats frames and a lower one throws rendered frames away.
  fps: 20.0
  # libx264 constant quality, 0 to 51 and lower is better. 23 is libx264's
  # own default and keeps the dashboard text legible.
  crf: 23
  # On an i9-12900K with a moving test scene, veryfast took about 21% of one
  # core at 20 FPS and ultrafast about 14%, with files 2.3x larger. On a
  # weaker CPU such as a Jetson's, ultrafast is the safer choice.
  preset: veryfast
  # Frames waiting for the encoder. When it falls behind, new frames are
  # dropped from the video rather than queued, so neither the dashboard nor
  # the control loop ever waits on it. Each 1600 x 900 frame holds 4.3 MB,
  # and each 1920 x 1080 --presentation frame 6.2 MB.
  queue_frames: 8

presentation:
  # --presentation records a 1920 x 1080 video for an audience outside the
  # team: this chase camera on the left, the dashcam overlay and key stats on
  # the right. It is attached only with that flag, and no pipeline stage
  # reads it, so nothing here changes how the vehicle drives.
  orbit_camera:
    # BeamNG vehicle space: +X left, +Y behind, +Z up. 6 m back and 2.6 m up
    # keeps the whole vehicle in frame with the trail ahead of it visible.
    pos: [0.0, 6.0, 2.6]
    # Tilted down enough that the vehicle sits in the lower half of the view
    # and the trail it is about to drive fills the rest.
    pitch_deg: -12.0
    sensor:
      model: Orbit
      # Close to the 1228 x 932 orbit view's aspect, so the cover fit crops
      # almost nothing. Smaller than the view because the main loop polls
      # this camera after every dashcam frame and every pixel costs capture
      # time there; raise it only if orbit_capture stays short.
      width: 960
      height: 728
      # Horizontal FOV. Wide enough for the vehicle and both trail edges at
      # 6 m without the fisheye stretch of the dashcam's 120 degrees.
      fov_h: 95.0
      # Matches recording.fps; the video cannot show orbit frames faster
      # than it records them.
      target_fps: 20.0
